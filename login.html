<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Zenix VPN Hub</title>

    <meta
        name="description"
        content="Login to your Zenix VPN Hub account."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                <span class="logo-zenix">ZENIX</span>
                <span class="logo-hub">VPN HUB</span>
            </a>

            <button
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav" id="mainNav">

    <a href="index.html">
        Home
    </a>

    <a href="vpn-files.html">
        VPN Files
    </a>

    <a href="servers.html">
        Servers
    </a>

    <a href="tools.html">
        Tools
    </a>

    <a href="tutorials.html">
        Tutorials
    </a>

    <a href="login.html">
        Login
    </a>

    <a href="register.html">
        Create Account
    </a>

            </nav>

        </div>

    </header>


    <!-- LOGIN -->

    <main>

        <section class="auth-page">

            <div class="auth-card">

                <div class="auth-heading">

                    <div class="auth-icon">
                        🔐
                    </div>

                    <span>
                        ZENIX VPN HUB
                    </span>

                    <h1>
                        Welcome Back
                    </h1>

                    <p>
                        Login to manage your Zenix account.
                    </p>

                </div>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <div class="login-options">

                        <label class="remember-row">

                            <input
                                type="checkbox"
                                id="rememberMe"
                            >

                            <span>
                                Remember me
                            </span>

                        </label>

                        <a href="#">
                            Forgot password?
                        </a>

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>


                    <p
                        id="loginMessage"
                        class="form-message"
                        aria-live="polite"
                    ></p>

                </form>


                <div class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-logo">
                ZENIX <span>VPN HUB</span>
            </div>

            <p>
                © 2026 Zenix VPN Hub. All rights reserved.
            </p>

            <p class="footer-note">
                Secure account system coming soon.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
