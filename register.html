<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Zenix VPN Hub</title>

    <meta
        name="description"
        content="Create your Zenix VPN Hub account."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                <span class="logo-zenix">ZENIX</span>
                <span class="logo-hub">VPN HUB</span>
            </a>

            <button
                class="menu-button"
                id="menuButton"
                aria-label="Open menu"
                aria-expanded="false"
            >
                ☰
            </button>

            <nav class="nav" id="mainNav">

    <a href="index.html">
        Home
    </a>

    <a href="vpn-files.html">
        VPN Files
    </a>

    <a href="servers.html">
        Servers
    </a>

    <a href="tools.html">
        Tools
    </a>

    <a href="tutorials.html">
        Tutorials
    </a>

    <a href="login.html">
        Login
    </a>

    <a href="register.html">
        Create Account
    </a>

            </nav>

        </div>

    </header>


    <!-- REGISTER -->

    <main>

        <section class="auth-page">

            <div class="auth-card">

                <div class="auth-heading">

                    <div class="auth-icon">
                        👤
                    </div>

                    <span>
                        ZENIX VPN HUB
                    </span>

                    <h1>
                        Create Account
                    </h1>

                    <p>
                        Create your account to manage
                        your Zenix downloads.
                    </p>

                </div>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="username">
                            Username
                        </label>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Choose a username"
                            minlength="3"
                            maxlength="30"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repeat your password"
                            minlength="8"
                            required
                        >

                    </div>


                    <label class="checkbox-row">

                        <input
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <span>
                            I agree to the Zenix Terms of
                            Service and Privacy Policy.
                        </span>

                    </label>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Create Account
                    </button>


                    <p
                        id="registerMessage"
                        class="form-message"
                        aria-live="polite"
                    ></p>

                </form>


                <div class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login
                    </a>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="footer">

        <div class="container">

            <div class="footer-logo">
                ZENIX <span>VPN HUB</span>
            </div>

            <p>
                © 2026 Zenix VPN Hub. All rights reserved.
            </p>

            <p class="footer-note">
                Account system is currently in development.
            </p>

        </div>

    </footer>


    <script src="script.js"></script>

</body>
</html>
